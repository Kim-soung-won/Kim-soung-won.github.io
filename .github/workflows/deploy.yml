# 워크플로우의 이름입니다. GitHub Actions 탭에서 확인 가능합니다.
name: Deploy to GitHub Pages

on:
  # main 브랜치에 push가 발생할 때 실행됩니다.
  push:
    branches: ["main"]

  # Actions 탭에서 수동으로 실행할 수도 있게 해줍니다.
  workflow_dispatch:

# GITHUB_TOKEN의 권한을 설정합니다. 배포를 위해 contents: read, pages: write가 필요합니다.
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 진행되지 않도록 설정합니다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. 빌드 작업
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # 또는 yarn, pnpm 사용 시 변경

      - name: Install dependencies
        run: npm ci # package-lock.json을 기준으로 엄격하게 설치

      - name: Build
        run: npm run build

      # 중요: Jekyll 처리를 비활성화하기 위해 .nojekyll 파일을 생성합니다.
      # Next.js는 _next 폴더를 사용하는데, Jekyll은 _로 시작하는 폴더를 무시하기 때문입니다.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # Next.js의 output: 'export' 기본 결과물 폴더

  # 2. 배포 작업
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4